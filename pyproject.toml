[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-assistant"
version = "0.1.0"
description = "An agentic job application and interview assistant"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-openai",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2",
    "python-dotenv",
    "fastapi",
    "uvicorn"
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]